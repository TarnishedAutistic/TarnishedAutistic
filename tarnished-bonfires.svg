<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 275" width="800" height="275">
  <defs>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#2c3b52"/><stop offset="50%" stop-color="#C9A227"/><stop offset="100%" stop-color="#2c3b52"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-800 0;800 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="45%" stop-color="#4FC3F7"/><stop offset="100%" stop-color="#1565C0" stop-opacity="0"/></radialGradient>
    <style>
      .h { font-family: Georgia, serif; font-size: 13px; fill: #4FC3F7; letter-spacing: 4px; }
      .t { font-family: Georgia, serif; font-size: 17px; fill: #C9A227; letter-spacing: 1px; }
      .s { font-family: Georgia, serif; font-size: 11px; fill: #8b949e; letter-spacing: 3px; }
      .d { font-family: Georgia, serif; font-size: 14px; fill: #c9d1d9; font-style: italic; }
      .m { font-family: Georgia, serif; font-size: 13px; fill: #8b949e; font-style: italic; }
    </style>
    <linearGradient id="fog" x1="0" x2="1"><stop offset="0%" stop-color="#90A4AE" stop-opacity="0"/><stop offset="50%" stop-color="#90A4AE" stop-opacity="0.12"/><stop offset="100%" stop-color="#90A4AE" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="798" height="273" rx="10" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
  <text x="30" y="30" class="h">⚜ MAP OF BONFIRES ⚜</text>
  <text x="30" y="50" class="m">Each project is a bonfire. Some are lit, others still lie beyond the fog.</text>
  
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3;1" dur="1.0s" fill="freeze"/>
    <rect x="30" y="65" width="740" height="56" rx="8" fill="#111826" stroke="#1f2937"/>
    <g opacity="0.55">
      <rect x="51" y="97" width="28" height="5" rx="2" fill="#4a3424"/>
      <path fill="#455A64" d="M65 79 C72 87 73 93 70 97 L60 97 C57 93 58 87 65 79 Z">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" begin="0s" repeatCount="indefinite"/></path></g>
    <text x="100" y="89" class="t">Coming soon</text>
    <text x="100" y="108" class="m">First AI-made mod</text>
    <text x="750" y="99" text-anchor="end" class="s">BEYOND THE FOG</text>
  </g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.4s" fill="freeze"/>
    <rect x="30" y="135" width="740" height="56" rx="8" fill="#111826" stroke="#1f2937"/>
    <g opacity="0.55">
      <rect x="51" y="167" width="28" height="5" rx="2" fill="#4a3424"/>
      <path fill="#455A64" d="M65 149 C72 157 73 163 70 167 L60 167 C57 163 58 157 65 149 Z">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" begin="1s" repeatCount="indefinite"/></path></g>
    <text x="100" y="159" class="t">Coming soon</text>
    <text x="100" y="178" class="m">Next experiment</text>
    <text x="750" y="169" text-anchor="end" class="s">BEYOND THE FOG</text>
  </g>
  <rect x="-400" y="60" width="500" height="165" fill="url(#fog)">
    <animateTransform attributeName="transform" type="translate" values="0 0;1300 0" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="30" y="257" class="m">Notice from the Covenant: most relics here were forged by AI (Claude and others) together with me.</text>
</svg>
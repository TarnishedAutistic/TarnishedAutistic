name: Blue Flame Snake

on:
  schedule:
    - cron: "0 */24 * * *"   # roda uma vez por dia
  workflow_dispatch:          # botão pra rodar manualmente
  push:
    branches: [main]          # roda quando você fizer commit na main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gerar a cobra de fogo azul
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/blue-flame.svg?color_snake=#4FC3F7&color_dots=#161b22,#0d3a5c,#1565c0,#29b6f6,#b3e5fc

      - name: Enviar a animação para a branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

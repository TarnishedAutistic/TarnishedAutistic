<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#2c3b52"/><stop offset="50%" stop-color="#C9A227"/><stop offset="100%" stop-color="#2c3b52"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-800 0;800 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="45%" stop-color="#4FC3F7"/><stop offset="100%" stop-color="#1565C0" stop-opacity="0"/></radialGradient>
    <style>
      .h { font-family: Georgia, serif; font-size: 13px; fill: #4FC3F7; letter-spacing: 4px; }
      .t { font-family: Georgia, serif; font-size: 17px; fill: #C9A227; letter-spacing: 1px; }
      .s { font-family: Georgia, serif; font-size: 11px; fill: #8b949e; letter-spacing: 3px; }
      .d { font-family: Georgia, serif; font-size: 14px; fill: #c9d1d9; font-style: italic; }
      .m { font-family: Georgia, serif; font-size: 13px; fill: #8b949e; font-style: italic; }
    </style></defs>
  <rect x="1" y="1" width="798" height="248" rx="10" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
  <text x="30" y="30" class="h">⚜ EQUIPMENT ⚜</text>

  <!-- slot 1: espirito -->
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.222;1" dur="0.8999999999999999s" fill="freeze"/>
    <rect x="30" y="50" width="80" height="80" rx="8" fill="#111826" stroke="#C9A227">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="70" cy="90" r="22" fill="url(#orb)">
      <animate attributeName="r" values="18;24;18" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="90" r="2" fill="#B3E5FC">
      <animateMotion dur="3s" repeatCount="indefinite" path="M0 0 m-26 0 a26 12 0 1 1 52 0 a26 12 0 1 1 -52 0"/>
    </circle>
    <text x="130" y="68" class="s">RIGHT ARMAMENT</text>
    <text x="130" y="90" class="t">Claude AI</text>
    <text x="130" y="112" class="d">A spirit of knowledge bound to the wielder. Answers when summoned,</text>
    <text x="130" y="130" class="d">and grows stronger the clearer the question.</text>
  </g>

  <!-- slot 2: escudo -->
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.462;1" dur="1.2999999999999998s" fill="freeze"/>
    <rect x="30" y="150" width="80" height="80" rx="8" fill="#111826" stroke="#C9A227">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <path d="M70 165 L95 175 Q95 205 70 218 Q45 205 45 175 Z" fill="#3a4658" stroke="#C9A227" stroke-width="2"/>
    <path d="M70 175 L70 208 M57 188 L83 188" stroke="#4FC3F7" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
    <rect x="45" y="165" width="8" height="55" fill="#FFFFFF" opacity="0">
      <animate attributeName="x" values="40;95" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.25;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="130" y="168" class="s">LEFT ARMAMENT</text>
    <text x="130" y="190" class="t">VS Code</text>
    <text x="130" y="212" class="d">A trusted shield. Has blocked more errors than anyone can count.</text>
  </g>
</svg>
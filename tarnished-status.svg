    <line x1="30" y1="236" x2="770" y2="236" stroke="#1f2937"/>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.676;1" dur="1.85s" fill="freeze"/>
    <text x="36" y="262" class="k">HOBBIES</text>

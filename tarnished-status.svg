<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 308" width="800" height="308">
  <defs>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#2c3b52"/><stop offset="50%" stop-color="#C9A227"/><stop offset="100%" stop-color="#2c3b52"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-800 0;800 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .k { font-family: Georgia, serif; font-size: 13px; fill: #C9A227; letter-spacing: 3px; }
      .v { font-family: Georgia, serif; font-size: 15px; fill: #c9d1d9; }
      .h { font-family: Georgia, serif; font-size: 13px; fill: #4FC3F7; letter-spacing: 4px; }
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="306" rx="10" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
  <text x="30" y="28" class="h">⚜ STATUS ⚜</text>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" dur="0.6s" fill="freeze"/>
    <text x="36" y="62" class="k">NAME</text>
    <text x="190" y="62" class="v">TarnishedAutistic</text>
    <line x1="30" y1="76" x2="770" y2="76" stroke="#1f2937"/>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.294;1" dur="0.85s" fill="freeze"/>

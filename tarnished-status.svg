  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.455;1" dur="1.1s" fill="freeze"/>
    <text x="36" y="142" class="k">CLASS</text>
    <text x="190" y="142" class="v">Software Engineering Student</text>
    <line x1="30" y1="156" x2="770" y2="156" stroke="#1f2937"/>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.556;1" dur="1.35s" fill="freeze"/>
    <text x="36" y="182" class="k">TRAIT</text>
    <text x="190" y="182" class="v">Autistic • Optimistic • Enthusiastic</text>
    <line x1="30" y1="196" x2="770" y2="196" stroke="#1f2937"/>
  </g>
